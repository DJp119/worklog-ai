<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Preview — Dark Botanical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0c0b;
    --ivory: #f2ede4;
    --gold: #c9a86a;
    --blush: #c98a7a;
    --muted: rgba(242,237,228,.55);
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ivory);
    font-family: "IBM Plex Sans", sans-serif;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
  }
  /* Blurred abstract circles — Dark Botanical signature */
  .orb {
    position: fixed; border-radius: 50%;
    filter: blur(80px); pointer-events: none; opacity: .5;
    animation: breathe 12s ease-in-out infinite alternate;
  }
  .o1 { width: 36vw; height: 36vw; background: radial-gradient(circle, rgba(201,168,106,.35), transparent 70%); top: -8vw; right: 8vw; }
  .o2 { width: 28vw; height: 28vw; background: radial-gradient(circle, rgba(201,138,122,.28), transparent 70%); bottom: -6vw; left: 6vw; animation-delay: -6s; }
  @keyframes breathe { to { transform: scale(1.12) translate(2vw, -2vh); } }
  main {
    flex: 1; position: relative;
    display: flex; flex-direction: column; justify-content: center;
    padding: clamp(1.5rem, 6vw, 7rem);
  }
  /* Fine rule with kicker */
  .rule {
    display: flex; align-items: center; gap: 1rem;
    margin-bottom: clamp(.9rem, 3vh, 2rem);
  }
  .rule::before { content: ""; width: clamp(2rem, 6vw, 5rem); height: 1px; background: var(--gold); }
  .rule span {
    font-size: clamp(.65rem, 1.1vw, .85rem);
    letter-spacing: .4em; text-transform: uppercase;
    color: var(--gold);
  }
  h1 {
    font-family: "Cormorant", serif; font-weight: 600;
    font-size: clamp(3rem, 10vw, 8.5rem);
    line-height: .98;
    max-width: 14ch;
  }
  h1 em { font-style: italic; font-weight: 500; color: var(--blush); }
  .sub {
    margin-top: clamp(1rem, 3.5vh, 2.2rem);
    font-size: clamp(.95rem, 2vw, 1.35rem);
    color: var(--muted);
    max-width: 46ch; line-height: 1.5;
    font-weight: 300;
  }
  .fade { opacity: 0; transform: translateY(18px); animation: fadein 1.2s ease forwards; }
  .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .65s; }
  @keyframes fadein { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .fade, .orb { animation-duration: .01ms; animation-iteration-count: 1; }
  }
</style>
</head>
<body>
  <div class="orb o1" aria-hidden="true"></div>
  <div class="orb o2" aria-hidden="true"></div>
  <main>
    <div class="rule fade d1"><span>a quiet record of good work</span></div>
    <h1 class="fade d2">Your year of work, <em>remembered.</em></h1>
    <p class="sub fade d3">Five minutes each week. A ledger of real accomplishments. And when appraisal season arrives, the words are already written. Dark Botanical preset.</p>
  </main>
</body>
</html>
