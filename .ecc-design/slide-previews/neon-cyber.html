<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Preview — Neon Cyber</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070a1f;
    --cyan: #22e0ff;
    --magenta: #ff2ec4;
    --ink: #eaf6ff;
    --muted: rgba(234,246,255,.55);
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Satoshi", sans-serif;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    position: relative;
  }
  /* Data-grid backdrop — Neon Cyber signature */
  .grid-bg {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(34,224,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,224,255,.07) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse at 50% 55%, black 30%, transparent 75%);
    pointer-events: none;
  }
  /* Glow blobs */
  .blob {
    position: fixed; border-radius: 50%;
    filter: blur(90px); pointer-events: none;
    animation: drift 9s ease-in-out infinite alternate;
  }
  .b1 { width: 42vw; height: 42vw; background: rgba(34,224,255,.22); top: -12vw; left: -10vw; }
  .b2 { width: 34vw; height: 34vw; background: rgba(255,46,196,.18); bottom: -14vw; right: -8vw; animation-delay: -4.5s; }
  @keyframes drift { to { transform: translate(4vw, 3vh) scale(1.08); } }
  main {
    flex: 1; position: relative;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center;
    padding: clamp(1.5rem, 5vw, 5rem);
  }
  .chip {
    font-size: clamp(.65rem, 1.1vw, .85rem);
    letter-spacing: .3em; text-transform: uppercase;
    color: var(--cyan);
    border: 1px solid rgba(34,224,255,.4);
    padding: .45em 1.2em; border-radius: 999px;
    box-shadow: 0 0 24px rgba(34,224,255,.25) inset, 0 0 18px rgba(34,224,255,.15);
    margin-bottom: clamp(.9rem, 3vh, 2rem);
  }
  h1 {
    font-family: "Clash Display", sans-serif; font-weight: 700;
    font-size: clamp(2.8rem, 10vw, 8rem);
    line-height: 1;
    background: linear-gradient(100deg, var(--ink) 30%, var(--cyan) 65%, var(--magenta) 95%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    text-shadow: 0 0 60px rgba(34,224,255,.25);
  }
  .sub {
    margin-top: clamp(.8rem, 2.5vh, 1.6rem);
    font-size: clamp(1rem, 2.4vw, 1.6rem); font-weight: 500;
    color: var(--muted);
    max-width: 44ch;
  }
  .sub b { color: var(--cyan); font-weight: 700; }
  .rise { opacity: 0; transform: translateY(24px); animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1 { animation-delay: .05s; } .d2 { animation-delay: .25s; } .d3 { animation-delay: .45s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .rise, .blob { animation-duration: .01ms; animation-iteration-count: 1; }
  }
</style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <div class="blob b1" aria-hidden="true"></div>
  <div class="blob b2" aria-hidden="true"></div>
  <main>
    <p class="chip rise d1">signal captured weekly</p>
    <h1 class="rise d2">worklog-ai</h1>
    <p class="sub rise d3">Your memory is a cache miss. <b>The log is the source of truth</b> — and the appraisal writes itself. Neon Cyber preset.</p>
  </main>
</body>
</html>
